name: Trigger Hackenbush site cleanup

on:
  push:
    branches: [main]
    paths:
      - simulations/green-hackenbush/cleanup-trigger.txt

permissions:
  contents: write

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the prepared cleanup script
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('.github/workflows/one-time-hackenbush-site-cleanup.yml')
          source = source_path.read_text(encoding='utf-8')
          marker = "      - name: Update simulator, guide, and redirect\n        shell: python\n        run: |\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n      - name: Commit the site cleanup", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, str(source_path), 'exec'), {})

          Path('.github/workflows/trigger-hackenbush-cleanup.yml').unlink()
          Path('simulations/green-hackenbush/cleanup-trigger.txt').unlink()

      - name: Commit the completed cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Hackenbush site navigation and remove iframe shell"
          git push
