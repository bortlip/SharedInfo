name: One-time Hackenbush site cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-hackenbush-site-cleanup.yml

permissions:
  contents: write

jobs:
  update-site:
    if: contains(github.event.head_commit.message, 'Add one-time Hackenbush site cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update simulator, guide, and redirect
        shell: python
        run: |
          from pathlib import Path
          import re

          base = Path('simulations/green-hackenbush')
          sim_path = base / 'simulator.html'
          guide_path = base / 'the-last-gardener.html'
          index_path = base / 'index.html'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # --- Simulator -----------------------------------------------------
          sim = sim_path.read_text(encoding='utf-8')

          sim_css = r'''

    /* Shared site chrome */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(12px);
    }
    .site-header-inner {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
    }
    .site-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .site-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
    }
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
    }
    .site-link, .site-theme, .site-version {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 10px;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 650;
    }
    .site-link:hover { border-color: var(--accent); }
    .site-link.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .site-version { color: var(--muted); font-weight: 750; }
    .site-theme {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px 4px 9px;
      color: var(--muted);
    }
    .site-theme select {
      width: auto;
      border: 0;
      background: transparent;
      padding: 4px 18px 4px 3px;
    }
    .mode-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }
    .guide-cta {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 11px;
      background: var(--panel);
      padding: 13px 15px;
    }
    .guide-cta strong { display: block; margin-bottom: 4px; }
    .guide-cta a { color: var(--accent-strong); font-weight: 750; }
    .site-footer {
      margin-top: 18px;
      padding: 16px 8px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: .88rem;
    }
    .site-footer a { color: var(--accent-strong); font-weight: 650; }
    @media (max-width: 820px) {
      .site-header-inner { align-items: flex-start; flex-direction: column; }
      .site-nav { justify-content: flex-start; }
      .mode-bar { justify-content: flex-start; }
    }
    @media (max-width: 560px) {
      .site-header-inner { width: min(100% - 12px, 1180px); }
      .site-link, .site-version { padding: 6px 8px; }
    }
          '''
          sim = replace_once(sim, '  </style>', sim_css + '\n  </style>', 'simulator CSS insertion')

          old_sim_header_pattern = re.compile(
              r'<body>\s*<main class="app" id="app">\s*<header class="app-header">.*?</header>',
              re.S,
          )
          new_sim_header = '''<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="simulator.html"><span class="site-mark">♜</span><span>Green Hackenbush Garden</span></a>
      <nav class="site-nav" aria-label="Site navigation">
        <a class="site-link active" href="simulator.html">Simulator</a>
        <a class="site-link" href="the-last-gardener.html">Puzzle &amp; Guide</a>
        <a class="site-link" href="THE_LAST_GARDENER.md">Markdown</a>
        <a class="site-link" href="https://github.com/bortlip/SharedInfo/tree/main/simulations/green-hackenbush">Source</a>
        <span class="site-version">App v1.1.0</span>
        <label class="site-theme">Theme
          <select id="theme-select" aria-label="Color theme">
            <option id="system-theme-option" value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </nav>
    </div>
  </header>
  <main class="app" id="app">
    <div class="mode-bar">
      <nav class="tabs" aria-label="Simulator mode">
        <button type="button" class="tab active" data-view="play">Play</button>
        <button type="button" class="tab" data-view="explain">Explain</button>
      </nav>
    </div>'''
          sim, count = old_sim_header_pattern.subn(new_sim_header, sim, count=1)
          if count != 1:
              raise RuntimeError(f'simulator header: expected one match, found {count}')

          old_footer_pattern = re.compile(r'<footer class="app-footer">.*?</footer>', re.S)
          new_sim_footer = '''<footer class="site-footer">
      Green Hackenbush Garden · App v1.1.0 ·
      <a href="simulator.html">Simulator</a> ·
      <a href="the-last-gardener.html">Puzzle &amp; Guide</a> ·
      <a href="THE_LAST_GARDENER.md">Markdown</a> ·
      <a href="https://github.com/bortlip/SharedInfo/tree/main/simulations/green-hackenbush">Source</a>
    </footer>'''
          sim, count = old_footer_pattern.subn(new_sim_footer, sim, count=1)
          if count != 1:
              raise RuntimeError(f'simulator footer: expected one match, found {count}')

          sim = replace_once(sim, "const APP_VERSION = '1.0.0';", "const APP_VERSION = '1.1.0';", 'app version')
          sim = replace_once(
              sim,
              "const $ = (selector) => root.querySelector(selector);\n    const $$ = (selector) => [...root.querySelectorAll(selector)];",
              "const $ = (selector) => document.querySelector(selector);\n    const $$ = (selector) => [...document.querySelectorAll(selector)];",
              'document selectors',
          )

          old_apply_theme = '''    function applyTheme(theme, persist = false) {
      const normalized = ['system', 'light', 'dark'].includes(theme) ? theme : 'system';
      if (normalized === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', normalized);
      $('#theme-select').value = normalized;

      if (persist) {
        try { window.localStorage.setItem(THEME_STORAGE_KEY, normalized); } catch { /* File previews can block storage. */ }
      }
    }'''
          new_apply_theme = '''    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');

    function resolvedSystemTheme() {
      return systemThemeMedia.matches ? 'dark' : 'light';
    }

    function updateSystemThemeLabel() {
      const option = $('#system-theme-option');
      if (option) option.textContent = `System (${resolvedSystemTheme()})`;
    }

    function applyTheme(theme, persist = false) {
      const normalized = ['system', 'light', 'dark'].includes(theme) ? theme : 'system';
      if (normalized === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', normalized);
      $('#theme-select').value = normalized;
      updateSystemThemeLabel();

      if (persist) {
        try { window.localStorage.setItem(THEME_STORAGE_KEY, normalized); } catch { /* File previews can block storage. */ }
      }
    }'''
          sim = replace_once(sim, old_apply_theme, new_apply_theme, 'system theme behavior')

          sim = replace_once(
              sim,
              "    $('#theme-select').addEventListener('change', () => applyTheme($('#theme-select').value, true));",
              "    $('#theme-select').addEventListener('change', () => applyTheme($('#theme-select').value, true));\n    systemThemeMedia.addEventListener?.('change', () => {\n      updateSystemThemeLabel();\n      if ($('#theme-select').value === 'system') applyTheme('system');\n    });",
              'system theme change listener',
          )

          deep_pattern = re.compile(r'\n        <details class="theory-deep">.*?\n        </details>', re.S)
          deep_replacement = '''
        <div class="guide-cta">
          <strong>Want the complete derivation and deeper theory?</strong>
          The simulator keeps the live analysis here; the full proof, move tables, mex discussion, XOR argument, and solver appendix live in the dedicated guide.
          <a href="the-last-gardener.html">Read the complete Puzzle &amp; Guide →</a>
        </div>'''
          sim, count = deep_pattern.subn(deep_replacement, sim, count=1)
          if count != 1:
              raise RuntimeError(f'deep theory replacement: expected one match, found {count}')

          sim_path.write_text(sim, encoding='utf-8')

          # --- Guide ---------------------------------------------------------
          guide = guide_path.read_text(encoding='utf-8')
          guide_css = r'''
.site-header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px)}
.site-header-inner{width:min(1180px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.site-brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:800;text-decoration:none;white-space:nowrap}
.site-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff}
.site-nav{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.site-link,.site-theme,.site-version{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:7px 10px;text-decoration:none;font-size:.86rem;font-weight:650}
.site-link:hover{border-color:var(--green)}.site-link.active{border-color:var(--green);background:var(--green-soft);color:var(--green2)}
.site-version{color:var(--muted);font-weight:750}.site-theme{display:flex;align-items:center;gap:5px;padding:4px 6px 4px 9px;color:var(--muted)}
.site-theme select{border:0;background:transparent;color:var(--ink);padding:4px 18px 4px 3px}
.site-footer{width:min(1180px,calc(100% - 28px));margin:0 auto 36px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.88rem}
.site-footer a{color:var(--green2);font-weight:650}
@media(max-width:900px){.site-header-inner{align-items:flex-start;flex-direction:column}.site-nav{justify-content:flex-start}}
@media(max-width:600px){.site-header-inner{width:min(100% - 12px,1180px)}.site-link,.site-version{padding:6px 8px}}
          '''
          guide = replace_once(guide, '</style>', guide_css + '\n</style>', 'guide CSS insertion')

          guide_header_pattern = re.compile(r'<header class="topbar">.*?</header>', re.S)
          new_guide_header = '''<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="simulator.html"><span class="site-mark">♜</span><span>Green Hackenbush Garden</span></a>
    <nav class="site-nav" aria-label="Site navigation">
      <a class="site-link" href="simulator.html">Simulator</a>
      <a class="site-link active" href="the-last-gardener.html">Puzzle &amp; Guide</a>
      <a class="site-link" href="THE_LAST_GARDENER.md">Markdown</a>
      <a class="site-link" href="https://github.com/bortlip/SharedInfo/tree/main/simulations/green-hackenbush">Source</a>
      <span class="site-version">Doc v1.0.3</span>
      <label class="site-theme">Theme
        <select id="theme" aria-label="Color theme">
          <option id="system" value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </nav>
  </div>
</header>'''
          guide, count = guide_header_pattern.subn(new_guide_header, guide, count=1)
          if count != 1:
              raise RuntimeError(f'guide header: expected one match, found {count}')

          guide_footer_pattern = re.compile(r'<footer>.*?</footer>', re.S)
          new_guide_footer = '''<footer class="site-footer">
  Green Hackenbush Garden · Doc v1.0.3 ·
  <a href="simulator.html">Simulator</a> ·
  <a href="the-last-gardener.html">Puzzle &amp; Guide</a> ·
  <a href="THE_LAST_GARDENER.md">Markdown</a> ·
  <a href="https://github.com/bortlip/SharedInfo/tree/main/simulations/green-hackenbush">Source</a>
</footer>'''
          guide, count = guide_footer_pattern.subn(new_guide_footer, guide, count=1)
          if count != 1:
              raise RuntimeError(f'guide footer: expected one match, found {count}')

          guide = guide.replace("green-hackenbush-guide-theme", "green-hackenbush-theme")
          guide_path.write_text(guide, encoding='utf-8')

          # --- Directory URL: redirect, do not iframe -----------------------
          index = '''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url=simulator.html">
  <link rel="canonical" href="https://bortlip.github.io/SharedInfo/simulations/green-hackenbush/simulator.html">
  <title>Green Hackenbush Garden</title>
  <script>location.replace('simulator.html' + location.search + location.hash);</script>
</head>
<body>
  <p>Opening the <a href="simulator.html">Green Hackenbush Garden simulator</a>…</p>
</body>
</html>
'''
          index_path.write_text(index, encoding='utf-8')

          # Delete this one-time workflow in the same commit.
          Path('.github/workflows/one-time-hackenbush-site-cleanup.yml').unlink()

      - name: Commit the site cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Hackenbush site navigation and remove iframe shell"
          git push
