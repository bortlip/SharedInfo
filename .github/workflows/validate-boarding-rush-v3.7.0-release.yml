name: Validate Boarding Rush v3.7.0 release

on:
  pull_request:
    branches:
      - main
    paths:
      - simulations/group-aware-boarding/simulator.html
      - .github/workflows/validate-boarding-rush-v3.7.0-release.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact promotion and protected redirect
        shell: bash
        run: |
          git fetch origin main
          cmp simulations/group-aware-boarding/dist/simulator.html simulations/group-aware-boarding/simulator.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          test "$(git diff --name-only origin/main -- simulations/group-aware-boarding | sort)" = "simulations/group-aware-boarding/simulator.html"

      - name: Validate version and bundled JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page=Path('simulations/group-aware-boarding/simulator.html').read_text(encoding='utf-8')
          assert 'const APP_VERSION = "3.7.0"' in page
          assert '<title>Boarding Rush — Aircraft Boarding Simulator</title>' in page
          match=re.search(r'<script>\s*(.*?)\s*</script>',page,re.S)
          assert match
          Path('/tmp/boarding-rush-release.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/boarding-rush-release.js

      - name: Run representative deterministic simulations
        shell: bash
        run: |
          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { METHODS } from './simulations/group-aware-boarding/src/js/constants.js';
          import { makeManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim } from './simulations/group-aware-boarding/src/js/simulation.js';

          for(const cfg of [
            {loadFactor:.95,familyShare:.35,partyWeights:[22,36,28,14],assistedParties:3,bagRate:.75,sequenceCompliance:.85,priorityPolicy:'assist',seed:12345,characterScenario:'none',disruptivePassengers:0,chatter:'off'},
            {loadFactor:1,familyShare:.30,partyWeights:[22,36,28,14],assistedParties:3,bagRate:.82,sequenceCompliance:.88,priorityPolicy:'assist',seed:8675309,characterScenario:'barbara',disruptivePassengers:1,chatter:'lively'}
          ]){
            const firstManifest=makeManifest(cfg.seed,cfg);
            const secondManifest=makeManifest(cfg.seed,cfg);
            assert.deepEqual(secondManifest,firstManifest);
            for(const method of METHODS){
              const first=new BoardingSim(firstManifest,method,cfg);
              const second=new BoardingSim(secondManifest,method,cfg);
              first.runToEnd(.1);
              second.runToEnd(.1);
              assert.equal(second.time,first.time,`${method} completion time`);
              assert.equal(second.seatConflicts,first.seatConflicts,`${method} conflicts`);
              assert.equal(second.blockedSeconds,first.blockedSeconds,`${method} blocked time`);
              assert.equal(second.completed,first.completed,`${method} passenger count`);
            }
          }
          NODE

      - name: Browser smoke test official root page
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-rush-release-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          query='v=1&pr=barbara&lf=100&fs=30&pw=22%2C36%2C28%2C14&ap=3&br=82&sc=88&pp=assist&dp=1&ct=lively&sp=16&sd=8675309&tr=40&ch=barbara&static=1&m=random%2Csteffen&view=standard&chart=small'
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/boarding-rush-release-profile --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/simulator.html?$query" > /tmp/release-dom.html
          grep -q 'v3.7.0' /tmp/release-dom.html
          grep -q 'Boarding Rush' /tmp/release-dom.html
          grep -q 'data-scenario-id="barbara"' /tmp/release-dom.html
          test "$(grep -o 'class="race-row' /tmp/release-dom.html | wc -l)" -ge 2

      - name: Remove temporary release workflow
        shell: bash
        run: |
          rm .github/workflows/validate-boarding-rush-v3.7.0-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-boarding-rush-v3.7.0-release.yml
          git commit -m 'Validate Boarding Rush v3.7.0 release'
          git push origin HEAD:${{ github.head_ref }}
