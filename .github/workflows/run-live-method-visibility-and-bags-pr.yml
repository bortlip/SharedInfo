name: Run live method visibility and luggage work on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply_live_method_visibility_and_bags.py
      - .github/workflows/run-live-method-visibility-and-bags-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/scripts/apply_live_method_visibility_and_bags.py

      - name: Validate JavaScript and luggage state
        shell: bash
        run: |
          for file in simulations/group-aware-boarding/src/js/*.js; do
            node --input-type=module --check < "$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { makeManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim } from './simulations/group-aware-boarding/src/js/simulation.js';

          const cfg={
            loadFactor:1,
            familyShare:.3,
            partyWeights:[22,36,28,14],
            assistedParties:3,
            bagRate:.9,
            sequenceCompliance:1,
            priorityPolicy:'assist',
            seed:12345
          };
          const manifest=makeManifest(cfg.seed,cfg);
          const sim=new BoardingSim(manifest,'random',cfg);
          const bagCount=sim.queue.filter(passenger=>passenger.hasBag).length;
          sim.runToEnd(.2);
          assert.equal(sim.stowedBags.length,bagCount);
          assert.equal([...sim.binLoad.values()].reduce((sum,count)=>sum+count,0),bagCount);
          assert.ok(sim.stowedBags.every(bag=>bag.row>=1 && bag.row<=31));
          assert.ok(sim.stowedBags.every(bag=>bag.side==='L' || bag.side==='R'));
          NODE

      - name: Build standalone candidate and validate syntax
        shell: bash
        run: |
          python simulations/group-aware-boarding/tools/build_simulator.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('simulations/group-aware-boarding/dist/simulator.html').read_text(encoding='utf-8')
          match=re.search(r'<script>\s*(.*?)\s*</script>',html,re.S)
          if not match:
              raise SystemExit('Bundled script not found')
          Path('/tmp/boarding-rush-bundle.js').write_text(match.group(1),encoding='utf-8')
          assert 'carry-on and overhead-bin placement' in html
          assert 'this.stowedBags=[]' in html
          assert 'for(const method of METHODS) sims[method].step(FIXED_DT)' in html
          assert 'for(const method of METHODS) sims[method]=new BoardingSim' in html
          PY
          node --check /tmp/boarding-rush-bundle.js

      - name: Verify protected release files remain unchanged
        shell: bash
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Browser smoke test and live reveal test
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-rush-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1

          "$browser" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/boarding-rush-chrome 'http://127.0.0.1:8765/dist/simulator.html?v=1&m=random,steffen&view=standard' >/tmp/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill $chrome_pid $server_pid' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/pages.json; then break; fi
            sleep .2
          done

          node <<'NODE'
          import assert from 'node:assert/strict';

          const pages=await fetch('http://127.0.0.1:9222/json/list').then(response=>response.json());
          const page=pages.find(item=>item.type==='page');
          assert.ok(page?.webSocketDebuggerUrl);
          const socket=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            socket.addEventListener('open',resolve,{once:true});
            socket.addEventListener('error',reject,{once:true});
          });

          let nextId=1;
          const pending=new Map();
          socket.addEventListener('message',event=>{
            const message=JSON.parse(event.data);
            if(!message.id || !pending.has(message.id)) return;
            const {resolve,reject}=pending.get(message.id);
            pending.delete(message.id);
            if(message.error) reject(new Error(JSON.stringify(message.error)));
            else resolve(message.result);
          });
          function command(method,params={}){
            const id=nextId++;
            socket.send(JSON.stringify({id,method,params}));
            return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));
          }
          async function evaluate(expression,awaitPromise=false){
            const response=await command('Runtime.evaluate',{expression,awaitPromise,returnByValue:true});
            if(response.exceptionDetails) throw new Error(JSON.stringify(response.exceptionDetails));
            return response.result.value;
          }

          await command('Runtime.enable');
          await evaluate("document.getElementById('runBtn').click()");
          await evaluate('new Promise(resolve=>setTimeout(resolve,900))',true);
          assert.equal(await evaluate("document.querySelector('[data-method=back]').hidden"),true);
          await evaluate("document.querySelector('.method-option input[value=back]').click()");
          assert.equal(await evaluate("document.querySelector('[data-method=back]').hidden"),false);
          const revealedTime=await evaluate("document.getElementById('backTime').textContent");
          assert.notEqual(revealedTime,'00:00');
          const before=await evaluate("document.getElementById('backTime').textContent");
          await evaluate('new Promise(resolve=>setTimeout(resolve,450))',true);
          const after=await evaluate("document.getElementById('backTime').textContent");
          assert.notEqual(after,before);
          assert.match(await evaluate("document.getElementById('status').textContent"),/still running in sync|run in sync/);
          socket.close();
          NODE

      - name: Commit validated changes and remove temporary tooling
        shell: bash
        run: |
          rm .github/scripts/apply_live_method_visibility_and_bags.py
          rm .github/workflows/run-live-method-visibility-and-bags-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulations/group-aware-boarding/src \
                  simulations/group-aware-boarding/dist/simulator.html \
                  simulations/group-aware-boarding/tasks \
                  .github/scripts/apply_live_method_visibility_and_bags.py \
                  .github/workflows/run-live-method-visibility-and-bags-pr.yml
          git commit -m 'Keep hidden methods synchronized and visualize luggage'
          git push origin HEAD:${{ github.head_ref }}
