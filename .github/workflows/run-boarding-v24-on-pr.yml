name: Run boarding simulator v2.4 patch on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-boarding-v24.yml
      - .github/workflows/run-boarding-v24-on-pr.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract and apply validated patch
        shell: bash
        run: |
          awk '/^          cat > \/tmp\/boarding-v24.patch <<'"'"'PATCH'"'"'$/{capture=1;next} capture && /^PATCH$/{exit} capture{sub(/^          /,"");print}' .github/workflows/apply-boarding-v24.yml > /tmp/boarding-v24.patch
          git apply --check /tmp/boarding-v24.patch
          git apply /tmp/boarding-v24.patch
          rm .github/workflows/apply-boarding-v24.yml .github/workflows/run-boarding-v24-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve benchmark controls and metric help"
          git push origin HEAD:${{ github.head_ref }}
