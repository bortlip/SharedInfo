name: Run live method visibility and luggage follow-up

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/run-live-method-visibility-and-bags-clean-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Copy the reviewed follow-up source onto current main
        shell: bash
        run: |
          git fetch origin feature/method-selection-and-layout
          paths=(
            simulations/group-aware-boarding/src/index.html
            simulations/group-aware-boarding/src/js/app.js
            simulations/group-aware-boarding/src/js/render.js
            simulations/group-aware-boarding/src/js/simulation.js
            simulations/group-aware-boarding/tasks/README.md
            simulations/group-aware-boarding/tasks/TASK-019-method-selection-and-race-layouts.md
            simulations/group-aware-boarding/tasks/TASK-020-visible-luggage-and-overhead-bins.md
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/feature/method-selection-and-layout:$path" > "$path"
          done

      - name: Validate JavaScript and luggage state
        shell: bash
        run: |
          for file in simulations/group-aware-boarding/src/js/*.js; do
            node --input-type=module --check < "$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { makeManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim } from './simulations/group-aware-boarding/src/js/simulation.js';

          const cfg={
            loadFactor:1,
            familyShare:.3,
            partyWeights:[22,36,28,14],
            assistedParties:3,
            bagRate:.9,
            sequenceCompliance:1,
            priorityPolicy:'assist',
            seed:12345
          };
          const manifest=makeManifest(cfg.seed,cfg);
          const sim=new BoardingSim(manifest,'random',cfg);
          const bagCount=sim.queue.filter(passenger=>passenger.hasBag).length;
          sim.runToEnd(.2);
          assert.equal(sim.stowedBags.length,bagCount);
          assert.equal([...sim.binLoad.values()].reduce((sum,count)=>sum+count,0),bagCount);
          assert.ok(sim.stowedBags.every(bag=>bag.row>=1 && bag.row<=31));
          assert.ok(sim.stowedBags.every(bag=>bag.side==='L' || bag.side==='R'));
          NODE

      - name: Build standalone candidate and validate syntax
        shell: bash
        run: |
          python simulations/group-aware-boarding/tools/build_simulator.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('simulations/group-aware-boarding/dist/simulator.html').read_text(encoding='utf-8')
          match=re.search(r'<script>\s*(.*?)\s*</script>',html,re.S)
          if not match:
              raise SystemExit('Bundled script not found')
          Path('/tmp/boarding-rush-bundle.js').write_text(match.group(1),encoding='utf-8')
          assert 'carry-on and overhead-bin placement' in html
          assert 'this.stowedBags=[]' in html
          assert 'for(const method of METHODS) sims[method].step(FIXED_DT)' in html
          assert 'for(const method of METHODS) sims[method]=new BoardingSim' in html
          PY
          node --check /tmp/boarding-rush-bundle.js

      - name: Verify protected release files remain unchanged
        shell: bash
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Browser smoke tests and synchronization assertions
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-rush-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1

          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:8765/src/?static=1&m=random,steffen&view=standard' >/tmp/source-two.html
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:8765/dist/simulator.html?static=1&m=random,steffen&view=standard' >/tmp/dist-two.html
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:8765/dist/simulator.html?static=1&m=random,back,front,zones,wilma,steffen&view=compact' >/tmp/dist-compact.html

          python - <<'PY'
          import re
          from pathlib import Path

          def visible_methods(path):
              html=Path(path).read_text(encoding='utf-8')
              cards=re.findall(r'<article class="card sim-card" data-method="([^"]+)"([^>]*)>',html)
              assert len(cards)==6, cards
              return [method for method,attrs in cards if 'hidden' not in attrs],html

          for path in ['/tmp/source-two.html','/tmp/dist-two.html']:
              visible,html=visible_methods(path)
              assert visible==['random','steffen'], visible
              assert html.count('class="method-option"')==6
              assert 'carry-on and overhead-bin placement' in html

          visible,html=visible_methods('/tmp/dist-compact.html')
          assert visible==['random','back','front','zones','wilma','steffen'], visible
          assert 'compact-view' in re.search(r'<main[^>]+id="simGrid"[^>]*>',html).group(0)

          app=Path('simulations/group-aware-boarding/src/js/app.js').read_text(encoding='utf-8')
          assert 'for(const method of METHODS) sims[method]=new BoardingSim' in app
          assert 'for(const method of METHODS) sims[method].step(FIXED_DT)' in app
          selection=app.split('function applyMethodSelection',1)[1].split('function setRaceLayout',1)[0]
          assert 'reset();' not in selection
          assert 'clearBenchmark();' in selection
          assert 'renderAll();' in selection
          PY

      - name: Commit validated changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/run-live-method-visibility-and-bags-clean-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulations/group-aware-boarding/src/index.html \
                  simulations/group-aware-boarding/src/js/app.js \
                  simulations/group-aware-boarding/src/js/render.js \
                  simulations/group-aware-boarding/src/js/simulation.js \
                  simulations/group-aware-boarding/dist/simulator.html \
                  simulations/group-aware-boarding/tasks/README.md \
                  simulations/group-aware-boarding/tasks/TASK-019-method-selection-and-race-layouts.md \
                  simulations/group-aware-boarding/tasks/TASK-020-visible-luggage-and-overhead-bins.md \
                  .github/workflows/run-live-method-visibility-and-bags-clean-pr.yml
          git commit -m 'Keep hidden methods synchronized and visualize luggage'
          git push origin HEAD:${{ github.head_ref }}
