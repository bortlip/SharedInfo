name: Revise boarding candidate structure

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/revise-boarding-structure.yml
      - simulations/group-aware-boarding/tools/build_simulator.py

permissions:
  contents: write

jobs:
  revise-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Create modular source and candidate build
        shell: bash
        run: |
          git fetch origin main
          python simulations/group-aware-boarding/tools/build_simulator.py --migrate

      - name: Verify protected release files are unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Validate modular and bundled JavaScript
        shell: bash
        run: |
          for file in simulations/group-aware-boarding/src/js/*.js; do
            node --input-type=module --check < "$file"
          done
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('simulations/group-aware-boarding/dist/simulator.html').read_text(encoding='utf-8')
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('Bundled script not found')
          Path('/tmp/boarding-bundle.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/boarding-bundle.js

      - name: Verify deterministic build output
        shell: bash
        run: |
          before=$(sha256sum simulations/group-aware-boarding/dist/simulator.html | cut -d' ' -f1)
          python simulations/group-aware-boarding/tools/build_simulator.py
          after=$(sha256sum simulations/group-aware-boarding/dist/simulator.html | cut -d' ' -f1)
          test "$before" = "$after"

      - name: Commit generated structure
        shell: bash
        run: |
          rm .github/workflows/revise-boarding-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise candidate structure and modularize source"
          git push origin HEAD:${{ github.head_ref }}
