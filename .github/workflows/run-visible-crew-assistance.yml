name: Add visible crew assistance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply_visible_crew_assistance.py
      - .github/workflows/run-visible-crew-assistance.yml

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply visible crew assistance
        run: python .github/scripts/apply_visible_crew_assistance.py

      - name: Validate JavaScript and crew mechanics
        shell: bash
        run: |
          for file in simulations/group-aware-boarding/src/js/*.js; do
            node --input-type=module --check < "$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { METHODS } from './simulations/group-aware-boarding/src/js/constants.js';
          import { makeManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim } from './simulations/group-aware-boarding/src/js/simulation.js';
          import { tooltipHtml } from './simulations/group-aware-boarding/src/js/interaction.js';

          const cfg={
            loadFactor:1,familyShare:.30,partyWeights:[22,36,28,14],assistedParties:3,
            bagRate:.82,sequenceCompliance:.88,priorityPolicy:'assist',seed:8675309,
            characterScenario:'barbara',disruptivePassengers:3,chatter:'lively'
          };
          const first=makeManifest(cfg.seed,cfg);
          const second=makeManifest(cfg.seed,cfg);
          assert.deepEqual(first.crewDefinition,second.crewDefinition);
          assert.equal(first.crewDefinition.displayName,'Maya');
          assert.deepEqual(
            first.characters.map(c=>[c.passengerId,c.type]),
            second.characters.map(c=>[c.passengerId,c.type])
          );
          assert.ok(first.characters.some(c=>c.type==='barbara'));
          assert.ok(first.characters.some(c=>c.type==='chatty'));
          assert.ok(first.characters.some(c=>c.type==='tipsy'));
          assert.ok(first.characters.some(c=>c.type==='needs-help'));

          const ids=first.passengers.map(p=>p.id).sort((a,b)=>a-b);
          let totalCrewTravel=0;
          let totalAssists=0;
          let totalCrewCrossings=0;
          for(const method of METHODS){
            const sim=new BoardingSim(first,method,cfg);
            assert.deepEqual(sim.queue.map(p=>p.id).sort((a,b)=>a-b),ids);
            assert.equal(new Set(sim.queue.map(p=>p.id)).size,sim.queue.length);
            sim.runToEnd(.1);
            assert.equal(sim.completed,sim.queue.length);
            assert.ok(sim.crew.assistsCompleted>=2,`${method} should assist Barbara and the help-needed traveler`);
            assert.ok(sim.crew.travelDistance>0,`${method} crew must visibly travel`);
            const barbara=sim.queue.find(p=>p.characterId==='barbara');
            const helper=sim.queue.find(p=>p.incidentType==='needs-help');
            assert.equal(barbara.crewAssistanceComplete,true);
            assert.equal(helper.crewAssistanceComplete,true);
            assert.equal(barbara.bagStowed,true);
            assert.equal(helper.bagStowed,true);
            assert.ok(barbara.crewEventDelay>barbara.crewFailDuration);
            assert.ok(helper.crewEventDelay>helper.crewFailDuration);
            assert.ok(barbara.eventDelaySeconds>barbara.heavyBagExtra);
            assert.ok(helper.eventDelaySeconds>helper.heavyBagExtra);
            assert.match(tooltipHtml({kind:'passenger',passenger:barbara},sim),/Crew help/);
            assert.match(tooltipHtml({kind:'passenger',passenger:helper},sim),/completed by Maya/);
            const crewHtml=tooltipHtml({kind:'crew',crew:sim.crew},sim);
            assert.match(crewHtml,/Maya/);
            assert.match(crewHtml,/Assists completed/);
            assert.match(crewHtml,/Aisle travel/);
            totalCrewTravel+=sim.crew.travelDistance;
            totalAssists+=sim.crew.assistsCompleted;
            totalCrewCrossings+=sim.crew.squeezePasses;
          }
          assert.ok(totalCrewTravel>50);
          assert.ok(totalAssists>=12);
          assert.ok(totalCrewCrossings>0,'crew should squeeze past at least one passenger across the six methods');
          NODE

      - name: Verify quiet flights preserve current main mechanics
        shell: bash
        run: |
          git fetch origin main
          rm -rf /tmp/basejs
          mkdir -p /tmp/basejs
          for file in constants.js random.js manifest.js methods.js simulation.js; do
            git show "origin/main:simulations/group-aware-boarding/src/js/$file" > "/tmp/basejs/$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { METHODS } from './simulations/group-aware-boarding/src/js/constants.js';
          import { makeManifest as CandidateManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim as CandidateSim } from './simulations/group-aware-boarding/src/js/simulation.js';
          import { makeManifest as MainManifest } from 'file:///tmp/basejs/manifest.js';
          import { BoardingSim as MainSim } from 'file:///tmp/basejs/simulation.js';

          for(const seed of [12345,246813579,987654321]){
            const cfg={
              loadFactor:.95,familyShare:.35,partyWeights:[22,36,28,14],assistedParties:3,
              bagRate:.75,sequenceCompliance:.85,priorityPolicy:'assist',seed,
              characterScenario:'none',disruptivePassengers:0,chatter:'off'
            };
            const beforeManifest=MainManifest(seed,cfg);
            const afterManifest=CandidateManifest(seed,cfg);
            assert.deepEqual(
              afterManifest.passengers.map(p=>[p.id,p.seatKey,p.walkSpeed,p.hasBag,p.bagBase,p.seatBase,p.displayName,p.characterId]),
              beforeManifest.passengers.map(p=>[p.id,p.seatKey,p.walkSpeed,p.hasBag,p.bagBase,p.seatBase,p.displayName,p.characterId])
            );
            for(const method of METHODS){
              const before=new MainSim(beforeManifest,method,cfg);
              const after=new CandidateSim(afterManifest,method,cfg);
              before.runToEnd(.1);
              after.runToEnd(.1);
              assert.equal(after.time,before.time,`${method} time changed for seed ${seed}`);
              assert.equal(after.seatConflicts,before.seatConflicts,`${method} conflicts changed for seed ${seed}`);
              assert.equal(after.blockedSeconds,before.blockedSeconds,`${method} blocked time changed for seed ${seed}`);
              assert.equal(after.completed,before.completed,`${method} passenger count changed for seed ${seed}`);
              assert.equal(after.crew.assistsCompleted,0);
              assert.equal(after.crew.travelDistance,0);
            }
          }
          NODE

      - name: Build reproducibly and validate generated output
        shell: bash
        run: |
          python simulations/group-aware-boarding/tools/build_simulator.py
          sha256sum simulations/group-aware-boarding/dist/simulator.html simulations/group-aware-boarding/model.html > /tmp/build-one.sha
          python simulations/group-aware-boarding/tools/build_simulator.py
          sha256sum simulations/group-aware-boarding/dist/simulator.html simulations/group-aware-boarding/model.html > /tmp/build-two.sha
          diff -u /tmp/build-one.sha /tmp/build-two.sha

          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('simulations/group-aware-boarding')
          dist=(root/'dist/simulator.html').read_text(encoding='utf-8')
          model=(root/'model.html').read_text(encoding='utf-8')
          task=(root/'tasks/TASK-003-event-and-character-framework-barbara.md').read_text(encoding='utf-8')
          assert 'const APP_VERSION = "3.7.0"' in dist
          assert 'Passenger needing help' in dist
          assert 'walking-to-passenger' in dist
          assert 'returning-front' in dist
          assert 'Assists completed' in dist
          assert 'Visible cabin-crew assistance' in model
          assert 'visible crew assistance implemented' in task.lower()
          match=re.search(r'<script>\s*(.*?)\s*</script>',dist,re.S)
          assert match
          Path('/tmp/boarding-rush-bundle.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/boarding-rush-bundle.js

      - name: Verify protected release files remain unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Browser smoke tests
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-rush-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1

          query='v=1&pr=barbara&lf=100&fs=30&pw=22%2C36%2C28%2C14&ap=3&br=82&sc=88&pp=assist&dp=3&ct=lively&sp=16&sd=8675309&tr=40&ch=barbara&static=1&m=random%2Csteffen&view=standard&chart=small'
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/source-crew-profile --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/src/?$query" > /tmp/source.html
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/dist-crew-profile --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/dist/simulator.html?$query" > /tmp/dist.html
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/model-crew-profile --virtual-time-budget=1200 --dump-dom 'http://127.0.0.1:8765/model.html' > /tmp/model.html

          python - <<'PY'
          import re
          from pathlib import Path
          for path in ['/tmp/source.html','/tmp/dist.html']:
              html=Path(path).read_text(encoding='utf-8')
              assert 'v3.7.0' in html
              button=re.search(r'<button[^>]+data-scenario-id="barbara"[^>]*>',html)
              assert button and 'disabled' not in button.group(0)
              assert html.count('class="race-row')>=2
              assert 'Disruptive passengers' in html
              assert 'Cabin chatter' in html
          model=Path('/tmp/model.html').read_text(encoding='utf-8')
          assert 'Visible cabin-crew assistance' in model
          assert 'v3.7.0' in model
          PY

      - name: Commit visible crew assistance
        shell: bash
        run: |
          rm .github/scripts/apply_visible_crew_assistance.py
          rm .github/workflows/run-visible-crew-assistance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add simulations/group-aware-boarding .github/scripts/apply_visible_crew_assistance.py .github/workflows/run-visible-crew-assistance.yml
          git commit -m 'Add visible cabin crew assistance'
          git push origin HEAD:${{ github.head_ref }}
