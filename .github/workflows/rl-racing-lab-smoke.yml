name: RL Racing Lab smoke

on:
  push:
    paths:
      - 'simulations/rl-racing-lab/**'
      - '.github/workflows/rl-racing-lab-smoke.yml'
  pull_request:
    paths:
      - 'simulations/rl-racing-lab/**'
      - '.github/workflows/rl-racing-lab-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulations/rl-racing-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source and browser smoke tests
        run: npm test
