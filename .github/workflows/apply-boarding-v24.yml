name: Apply boarding simulator v2.4 patch

on:
  push:
    branches:
      - fix/boarding-benchmark-controls
    paths:
      - .github/workflows/apply-boarding-v24.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boarding-benchmark-controls
          fetch-depth: 0
      - name: Apply validated simulator patch
