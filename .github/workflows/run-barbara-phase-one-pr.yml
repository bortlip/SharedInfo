name: Build Barbara phase one

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply_barbara_phase_one.py
      - .github/scripts/normalize_barbara_patcher.py
      - .github/workflows/run-barbara-phase-one-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Barbara phase one
        run: |
          python .github/scripts/normalize_barbara_patcher.py
          python .github/scripts/apply_barbara_phase_one.py

      - name: Validate modules and character framework
        shell: bash
        run: |
          for file in simulations/group-aware-boarding/src/js/*.js; do
            node --input-type=module --check < "$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { METHODS } from './simulations/group-aware-boarding/src/js/constants.js';
          import { makeManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { makeQueue } from './simulations/group-aware-boarding/src/js/methods.js';
          import { BoardingSim } from './simulations/group-aware-boarding/src/js/simulation.js';
          import { tooltipHtml } from './simulations/group-aware-boarding/src/js/interaction.js';
          import { parseScenarioSearch, serializeScenarioSettings } from './simulations/group-aware-boarding/src/js/scenarios.js';

          const settings={
            loadFactor:100,familyShare:30,partyWeights:[22,36,28,14],assistedParties:3,
            bagRate:82,sequenceCompliance:88,priorityPolicy:'assist',speed:16,
            seed:8675309,trials:40,characterScenario:'barbara'
          };
          const query=serializeScenarioSettings(settings,'barbara');
          assert.equal(parseScenarioSearch(`?${query}`).characterScenario,'barbara');
          assert.match(query,/ch=barbara/);

          const cfg={
            loadFactor:1,familyShare:.30,partyWeights:[22,36,28,14],assistedParties:3,
            bagRate:.82,sequenceCompliance:.88,priorityPolicy:'assist',seed:8675309,
            characterScenario:'barbara'
          };
          const first=makeManifest(cfg.seed,cfg);
          const second=makeManifest(cfg.seed,cfg);
          assert.deepEqual(first.characters,second.characters);
          const barbaras=first.passengers.filter(p=>p.characterId==='barbara');
          assert.equal(barbaras.length,1);
          const intrinsic=barbaras[0];
          assert.equal(intrinsic.displayName,'Barbara');
          assert.equal(intrinsic.hasBag,true);
          assert.ok(intrinsic.heavyBagExtra>8);
          assert.ok(intrinsic.restroomPauseRow>=3 && intrinsic.restroomPauseRow<intrinsic.row);
          assert.ok(intrinsic.restroomPauseDuration>=4.5 && intrinsic.restroomPauseDuration<=8);

          const manifestIds=first.passengers.map(p=>p.id).sort((a,b)=>a-b);
          const latePositions=new Set();
          for(const method of METHODS){
            const queue=makeQueue(first,method,cfg.priorityPolicy,cfg.sequenceCompliance);
            assert.equal(queue.length,first.passengers.length);
            assert.deepEqual(queue.map(p=>p.id).sort((a,b)=>a-b),manifestIds);
            assert.equal(new Set(queue.map(p=>p.id)).size,queue.length);
            const barbara=queue.find(p=>p.characterId==='barbara');
            assert.ok(barbara);
            assert.equal(queue[barbara.queueIndex].id,barbara.id);
            assert.equal(barbara.queueIndex,barbara.lateQueueIndex);
            assert.ok(barbara.queueIndex>=Math.floor(queue.length*.60));
            latePositions.add(barbara.queueIndex);

            const sim=new BoardingSim(first,method,cfg);
            sim.runToEnd(.1);
            const finished=sim.queue.find(p=>p.characterId==='barbara');
            assert.equal(sim.completed,sim.queue.length);
            assert.equal(finished.state,'seated');
            assert.equal(finished.restroomPauseComplete,true);
            assert.equal(finished.heavyBagDelayCounted,true);
            assert.ok(finished.eventDelaySeconds>=finished.heavyBagExtra+finished.restroomPauseDuration-.11);
            const html=tooltipHtml({kind:'seat',seatKey:finished.seatKey,isAssigned:true,occupant:finished,assigned:finished},sim);
            assert.match(html,/Barbara/);
            assert.match(html,/Late arrival/);
            assert.match(html,/Direct event delay/);
          }
          assert.equal(latePositions.size,1,'late insertion fraction should yield one shared target position');
          NODE

      - name: Verify ordinary scenarios preserve model results
        shell: bash
        run: |
          git fetch origin main
          rm -rf /tmp/basejs
          mkdir -p /tmp/basejs
          for file in constants.js random.js manifest.js methods.js simulation.js; do
            git show "origin/main:simulations/group-aware-boarding/src/js/$file" > "/tmp/basejs/$file"
          done

          node --experimental-default-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { METHODS } from './simulations/group-aware-boarding/src/js/constants.js';
          import { makeManifest as CandidateManifest } from './simulations/group-aware-boarding/src/js/manifest.js';
          import { BoardingSim as CandidateSim } from './simulations/group-aware-boarding/src/js/simulation.js';
          import { makeManifest as MainManifest } from 'file:///tmp/basejs/manifest.js';
          import { BoardingSim as MainSim } from 'file:///tmp/basejs/simulation.js';

          for(const seed of [12345,246813579,987654321]){
            const cfg={loadFactor:.95,familyShare:.35,partyWeights:[22,36,28,14],assistedParties:3,bagRate:.75,sequenceCompliance:.85,priorityPolicy:'assist',seed,characterScenario:'none'};
            const beforeManifest=MainManifest(seed,cfg);
            const afterManifest=CandidateManifest(seed,cfg);
            assert.deepEqual(
              afterManifest.passengers.map(p=>[p.id,p.seatKey,p.walkSpeed,p.hasBag,p.bagBase,p.seatBase,p.displayName,p.characterId]),
              beforeManifest.passengers.map(p=>[p.id,p.seatKey,p.walkSpeed,p.hasBag,p.bagBase,p.seatBase,p.displayName,p.characterId])
            );
            assert.deepEqual(afterManifest.characters,[]);
            for(const method of METHODS){
              const before=new MainSim(beforeManifest,method,cfg);
              const after=new CandidateSim(afterManifest,method,cfg);
              before.runToEnd(.1);
              after.runToEnd(.1);
              assert.equal(after.time,before.time,`${method} time changed for seed ${seed}`);
              assert.equal(after.seatConflicts,before.seatConflicts,`${method} conflicts changed for seed ${seed}`);
              assert.equal(after.blockedSeconds,before.blockedSeconds,`${method} blocked time changed for seed ${seed}`);
              assert.equal(after.completed,before.completed,`${method} completion changed for seed ${seed}`);
            }
          }
          NODE

      - name: Build simulator and model guide reproducibly
        shell: bash
        run: |
          python simulations/group-aware-boarding/tools/build_simulator.py
          sha256sum simulations/group-aware-boarding/dist/simulator.html simulations/group-aware-boarding/model.html > /tmp/build-one.sha
          python simulations/group-aware-boarding/tools/build_simulator.py
          sha256sum simulations/group-aware-boarding/dist/simulator.html simulations/group-aware-boarding/model.html > /tmp/build-two.sha
          diff -u /tmp/build-one.sha /tmp/build-two.sha

      - name: Validate generated content
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root=Path('simulations/group-aware-boarding')
          source=(root/'src/index.html').read_text(encoding='utf-8')
          dist=(root/'dist/simulator.html').read_text(encoding='utf-8')
          model=(root/'model.html').read_text(encoding='utf-8')
          task=(root/'tasks/TASK-003-event-and-character-framework-barbara.md').read_text(encoding='utf-8')
          scenarios=(root/'src/js/scenarios.js').read_text(encoding='utf-8')

          assert 'const APP_VERSION = "3.4.0"' in dist
          assert 'function applyCharacterScenario' in dist
          assert 'function repositionCharacterPassengers' in dist
          assert 'I should have used the restroom.' in dist
          assert 'This bag was lighter at home.' in dist
          assert 'characterScenario:"barbara"' in scenarios
          barbara_block=scenarios[scenarios.index('id:"barbara"'):scenarios.index('const PRIORITY_POLICIES')]
          assert 'disabled:true' not in barbara_block
          assert 'Barbara Mode and the character-event foundation' in model
          assert 'Phase 1 done in candidate' in task
          assert 'post-race recap' in task
          assert 'No separate event ticker' in task
          assert 'Barbara Mode' not in source, 'scenario cards should remain data-driven, not hard-coded in HTML'

          match=re.search(r'<script>\s*(.*?)\s*</script>',dist,re.S)
          assert match
          Path('/tmp/boarding-rush-bundle.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/boarding-rush-bundle.js

      - name: Verify protected release files remain unchanged
        shell: bash
        run: |
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Browser smoke tests
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-rush-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1

          query='v=1&pr=barbara&lf=100&fs=30&pw=22%2C36%2C28%2C14&ap=3&br=82&sc=88&pp=assist&sp=16&sd=8675309&tr=40&ch=barbara&static=1&m=random%2Csteffen&view=standard&chart=small'
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/source-barbara-profile --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/src/?$query" > /tmp/source.html
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/dist-barbara-profile --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8765/dist/simulator.html?$query" > /tmp/dist.html
          "$browser" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/model-barbara-profile --virtual-time-budget=1200 --dump-dom 'http://127.0.0.1:8765/model.html' > /tmp/model.html

          python - <<'PY'
          import re
          from pathlib import Path
          for path in ['/tmp/source.html','/tmp/dist.html']:
              html=Path(path).read_text(encoding='utf-8')
              assert 'v3.4.0' in html
              assert '>Barbara Mode<' in html
              assert 'Barbara is aboard.' in html
              button=re.search(r'<button[^>]+data-scenario-id="barbara"[^>]*>',html)
              assert button and 'disabled' not in button.group(0)
              assert 'data-scenario-id="barbara"' in html
              assert html.count('class="race-row')>=2
          model=Path('/tmp/model.html').read_text(encoding='utf-8')
          assert 'Barbara Mode and the character-event foundation' in model
          assert 'v3.4.0' in model
          PY

      - name: Commit validated changes and remove temporary tooling
        shell: bash
        run: |
          rm .github/scripts/apply_barbara_phase_one.py
          rm .github/scripts/normalize_barbara_patcher.py
          rm .github/workflows/run-barbara-phase-one-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add simulations/group-aware-boarding .github/scripts/apply_barbara_phase_one.py .github/scripts/normalize_barbara_patcher.py .github/workflows/run-barbara-phase-one-pr.yml
          git commit -m 'Add deterministic Barbara character events'
          git push origin HEAD:${{ github.head_ref }}
