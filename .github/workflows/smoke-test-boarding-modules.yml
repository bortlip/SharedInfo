name: Smoke test modular boarding candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/smoke-test-boarding-modules.yml
      - simulations/group-aware-boarding/src/**
      - simulations/group-aware-boarding/dist/simulator.html
      - simulations/group-aware-boarding/tools/build_simulator.py

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify protected release files
        shell: bash
        run: |
          git diff --exit-code origin/main -- simulations/group-aware-boarding/index.html
          git diff --exit-code origin/main -- simulations/group-aware-boarding/simulator.html

      - name: Verify reproducible candidate build
        shell: bash
        run: |
          before=$(sha256sum simulations/group-aware-boarding/dist/simulator.html | cut -d' ' -f1)
          python simulations/group-aware-boarding/tools/build_simulator.py
          after=$(sha256sum simulations/group-aware-boarding/dist/simulator.html | cut -d' ' -f1)
          test "$before" = "$after"

      - name: Browser smoke test source and standalone candidate
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          python3 -m http.server 8765 --directory simulations/group-aware-boarding >/tmp/boarding-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1

          "$browser" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=3000 --dump-dom \
            'http://127.0.0.1:8765/src/?static=1' >/tmp/source-dom.html 2>/tmp/source-chrome.log
          "$browser" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=1 --virtual-time-budget=3000 --dump-dom \
            'http://127.0.0.1:8765/dist/simulator.html?static=1' >/tmp/candidate-dom.html 2>/tmp/candidate-chrome.log

          python - <<'PY'
          from pathlib import Path
          checks = [
              (Path('/tmp/source-dom.html'), Path('/tmp/source-chrome.log')),
              (Path('/tmp/candidate-dom.html'), Path('/tmp/candidate-chrome.log')),
          ]
          failed = False
          for path, log_path in checks:
              html = path.read_text(encoding='utf-8')
              status_ok = 'Ready: 186/186 seats occupied' in html
              card_count = html.count('class="card sim-card"')
              benchmark_ok = 'id="benchBtn"' in html
              print(path.name, {'status_ok': status_ok, 'card_count': card_count, 'benchmark_ok': benchmark_ok})
              if not status_ok:
                  start = html.find('id="status"')
                  print('status fragment:', html[start:start + 300])
                  log = log_path.read_text(encoding='utf-8', errors='replace')
                  interesting = [line for line in log.splitlines() if 'CONSOLE' in line or 'Uncaught' in line or 'ReferenceError' in line or 'SyntaxError' in line]
                  print('browser diagnostics:')
                  print('\n'.join(interesting[-30:]) or '(no console diagnostic captured)')
              failed = failed or not status_ok or card_count != 6 or not benchmark_ok
          if failed:
              raise SystemExit(1)
          PY

      - name: Remove temporary workflow after successful validation
        shell: bash
        run: |
          rm .github/workflows/smoke-test-boarding-modules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate modular boarding source and candidate"
          git push origin HEAD:${{ github.head_ref }}
