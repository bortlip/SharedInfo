<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Play the Green Hackenbush Garden simulator or read the complete solution to The Last Gardener puzzle.">
  <link rel="canonical" href="https://bortlip.github.io/SharedInfo/simulations/green-hackenbush/">
  <title>Green Hackenbush Garden</title>
  <style>
    :root{color-scheme:light dark;--bar:#f7faf7;--text:#17211b;--muted:#657168;--border:#d5ddd7;--accent:#217346;--active:#e1f1e6}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#121a15;--text:#eef5f0;--muted:#a6b4aa;--border:#33423a;--accent:#72c68d;--active:#203a29}}
    :root[data-theme="dark"]{color-scheme:dark;--bar:#121a15;--text:#eef5f0;--muted:#a6b4aa;--border:#33423a;--accent:#72c68d;--active:#203a29}
    :root[data-theme="light"]{color-scheme:light}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bar);color:var(--text);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bar)}
    .brand{display:flex;align-items:center;gap:9px;min-width:max-content;font-weight:800}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:var(--accent);color:#fff}.version{color:var(--muted);font-size:.78rem}
    nav{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}a,.theme{border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);padding:7px 10px;text-decoration:none;font-weight:650}a:hover{border-color:var(--accent)}a.active{background:var(--active);border-color:var(--accent);color:var(--accent)}.theme{padding:3px 6px 3px 9px;color:var(--muted);font-weight:600}.theme select{border:0;background:transparent;color:var(--text);padding:4px 17px 4px 3px}
    iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:white}
    @media(max-width:700px){header{align-items:flex-start;flex-wrap:wrap}.brand{width:100%}nav{width:100%;justify-content:flex-start}.version{margin-left:auto}.theme{margin-left:auto}}
  </style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">♜</span><span>Green Hackenbush Garden</span><span class="version">v1.0.0</span></div>
  <nav aria-label="Site navigation">
    <a class="active" href="simulator.html" target="garden-frame">Simulator</a>
    <a href="the-last-gardener.html">Puzzle walkthrough</a>
    <a href="THE_LAST_GARDENER.md">Markdown</a>
    <a href="https://github.com/bortlip/SharedInfo/tree/main/simulations/green-hackenbush">Source</a>
    <label class="theme">Shell theme <select id="theme-select" aria-label="Shell color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </nav>
</header>
<iframe name="garden-frame" src="simulator.html" title="Green Hackenbush Garden simulator"></iframe>
<script>
(() => {
  const key='green-hackenbush-shell-theme',select=document.getElementById('theme-select'),allowed=['system','light','dark'];
  function apply(value,persist=false){const theme=allowed.includes(value)?value:'system';if(theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);select.value=theme;if(persist)try{localStorage.setItem(key,theme)}catch{}}
  let theme='system';try{const saved=localStorage.getItem(key);if(allowed.includes(saved))theme=saved}catch{}apply(theme);select.addEventListener('change',()=>apply(select.value,true));
})();
</script>
</body>
</html>
